<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Dicky Salim, Custom Full-Stack Cloudflare Solutions Builder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F38020"/><stop offset="1" stop-color="#FAAD3F"/></linearGradient>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .art{font-size:16px;fill:url(#g);font-weight:700}
