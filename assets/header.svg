    <clipPath id="r6"><rect class="rv" style="animation:type 1.0s steps(48) 3.3499999999999996s both;--w:478px" x="48" y="215" width="0" height="24"/></clipPath>
    <clipPath id="r7"><rect class="rv" style="animation:type 1.1s steps(53) 4.5s both;--w:526px" x="48" y="243" width="0" height="24"/></clipPath>
    <clipPath id="c"><rect width="1000" height="340" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
