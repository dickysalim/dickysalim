      .org{fill:#F38020}
      .rv{width:0}
      @keyframes type{from{width:0}to{width:var(--w)}}
      .prompt{animation:show .01s 5.80s both}
      .cur{animation:blink 1s steps(1) 5.80s infinite}
      @keyframes show{from{opacity:0}to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(310px)}}
    </style>
        <clipPath id="r0"><rect class="rv" style="animation:type 0.7s steps(8) 0.3s both;--w:90px" x="48" y="49" width="0" height="23"/></clipPath>
