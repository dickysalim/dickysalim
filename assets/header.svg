<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Dicky Salim, Custom Full-Stack Cloudflare Solutions Builder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F38020"/><stop offset="1" stop-color="#FAAD3F"/></linearGradient>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .art{font-size:16px;fill:url(#g);font-weight:700;letter-spacing:0;animation:glow 3s ease-in-out infinite alternate}
      .dim{font-size:14px;fill:#6b7394}
      .green{font-size:15px;fill:#7ee787}
      .txt{font-size:16px;fill:#e6e9f5}
      .org{font-size:16px;fill:#F38020}
      .l1{animation:show .01s 0.2s both}
      .l2{animation:show .01s 1.0s both}
      .l3{animation:show .01s 1.6s both}
      .l4{animation:show .01s 2.2s both}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes show{from{opacity:0}to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes glow{from{opacity:.85}to{opacity:1}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(300px)}}
    </style>
    <clipPath id="c"><rect x="0" y="0" width="1000" height="330" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="330" fill="#0d1117"/>
    <rect width="1000" height="34" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="44" cy="17" r="6" fill="#ffbd2e"/><circle cx="66" cy="17" r="6" fill="#27c93f"/>
    <text class="m dim" x="500" y="22" text-anchor="middle">dicky@cloudflare: ~</text>
    <g class="m">
    <text class="green l1" x="48" y="66" xml:space="preserve">$ whoami</text>
    <text class="art" x="48" y="112" xml:space="preserve">████   █████   ████  █   █  █   █     ████   ███   █      █████  █   █</text>
    <text class="art" x="48" y="134" xml:space="preserve">█   █    █    █      █  █    █ █     █      █   █  █        █    ██ ██</text>
    <text class="art" x="48" y="156" xml:space="preserve">█   █    █    █      ███      █       ███   █████  █        █    █ █ █</text>
    <text class="art" x="48" y="178" xml:space="preserve">█   █    █    █      █  █     █          █  █   █  █        █    █   █</text>
    <text class="art" x="48" y="200" xml:space="preserve">████   █████   ████  █   █    █      ████   █   █  █████  █████  █   █</text>
    <text class="txt l2" x="48" y="236" xml:space="preserve"><tspan class="org">&gt;</tspan> Custom Full-Stack Cloudflare Solutions Builder</text>
    <text class="txt l3" x="48" y="264" xml:space="preserve"><tspan class="org">&gt;</tspan> Discover  ::  Prototype  ::  Simplify  ::  Automate</text>
    <text class="green l4" x="48" y="300" xml:space="preserve">$ <tspan class="cur">█</tspan></text>
    </g>
    <rect class="scan" x="0" y="0" width="1000" height="3" fill="#ffffff" opacity=".04"/>
  </g>
</svg>