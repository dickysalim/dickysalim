<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Dicky Salim, Custom Full-Stack Cloudflare Solutions Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F38020"/>
      <stop offset="1" stop-color="#FAAD3F"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <style>
      .t{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
      .name{font-size:54px;font-weight:800;fill:#fff;animation:in 1s ease-out both}
      .sub{font-size:22px;fill:url(#accent);font-weight:600;animation:in 1s .4s ease-out both}
      .line{font-size:18px;fill:#c8cde0;animation:in 1s .8s ease-out both}
      @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .blob1{animation:f1 9s ease-in-out infinite alternate}
      .blob2{animation:f2 11s ease-in-out infinite alternate}
      @keyframes f1{to{transform:translate(120px,30px)}}
      @keyframes f2{to{transform:translate(-140px,-20px)}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".55">
    <circle class="blob1" cx="200" cy="60" r="90" fill="#F38020"/>
    <circle class="blob2" cx="820" cy="210" r="100" fill="#6d3df0"/>
  </g>
  <g class="t">
    <text class="name" x="60" y="112">Dicky Salim</text>
    <text class="sub" x="60" y="156">Custom Full-Stack Cloudflare Solutions Builder</text>
    <text class="line" x="60" y="196">Discover  →  Automate  →  Optimize<tspan class="cur" fill="#F38020"> ▍</tspan></text>
  </g>
</svg>
