<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Dicky Salim, Custom Full-Stack Cloudflare Solutions Builder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F38020"/><stop offset="1" stop-color="#FAAD3F"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.28"/></pattern>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .art{font-size:12px;fill:url(#g);font-weight:700}
      .dim{font-size:14px;fill:#6b7394}
      .green{font-size:15px;fill:#7ee787}
      .txt{font-size:20px;fill:#e6e9f5}
      .org{fill:#F38020}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .crt{animation:crt 5s steps(1) infinite}
      @keyframes crt{0%,100%{opacity:1}7%{opacity:.9}8%{opacity:1}41%{opacity:.93}42%{opacity:1}43%{opacity:.88}44%{opacity:1}77%{opacity:.94}78%{opacity:1}}
      .sweep{animation:sweep 4.5s linear infinite}
      @keyframes sweep{from{transform:translateY(-60px)}to{transform:translateY(300px)}}
      .fk{fill:#0d1117;opacity:0;animation-name:fk;animation-iteration-count:infinite;animation-timing-function:steps(1)}
      @keyframes fk{0%,94%{opacity:0}95%{opacity:.7}97%{opacity:.15}98%{opacity:.7}99.5%,100%{opacity:0}}
    </style>
    <clipPath id="c"><rect width="720" height="300" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="720" height="300" fill="#0d1117"/>
    <rect width="720" height="34" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="44" cy="17" r="6" fill="#ffbd2e"/><circle cx="66" cy="17" r="6" fill="#27c93f"/>
    <text class="m dim" x="360" y="22" text-anchor="middle">dicky@cloudflare: ~</text>
    <g class="m crt">
    <text class="green" x="24" y="66" xml:space="preserve">$ whoami</text>
    <text class="art" x="24" y="96" xml:space="preserve">████   █████   ████  █   █  █   █     ████   ███   █      █████  █   █</text>
    <text class="art" x="24" y="112" xml:space="preserve">█   █    █    █      █  █    █ █     █      █   █  █        █    ██ ██</text>
    <text class="art" x="24" y="128" xml:space="preserve">█   █    █    █      ███      █       ███   █████  █        █    █ █ █</text>
    <text class="art" x="24" y="144" xml:space="preserve">█   █    █    █      █  █     █          █  █   █  █        █    █   █</text>
    <text class="art" x="24" y="160" xml:space="preserve">████   █████   ████  █   █    █      ████   █   █  █████  █████  █   █</text>
    <rect class="fk" style="animation-duration:7.4s;animation-delay:4.1s" x="340.8" y="102" width="7.2" height="12"/><rect class="fk" style="animation-duration:9.2s;animation-delay:4.7s" x="312.0" y="86" width="7.2" height="12"/><rect class="fk" style="animation-duration:10.0s;animation-delay:5.0s" x="52.8" y="118" width="7.2" height="12"/><rect class="fk" style="animation-duration:9.6s;animation-delay:5.7s" x="520.8" y="134" width="7.2" height="12"/><rect class="fk" style="animation-duration:7.5s;animation-delay:4.7s" x="88.8" y="86" width="7.2" height="12"/>
    <text class="txt" x="24" y="199" xml:space="preserve"><tspan class="org">&gt;</tspan> Custom Full-Stack Cloudflare Solutions Builder</text>
    <text class="txt" x="24" y="232" xml:space="preserve"><tspan class="org">&gt;</tspan> Discover  ::  Prototype  ::  Simplify  ::  Automate</text>
    <text class="green" x="24" y="272" xml:space="preserve">$ <tspan class="cur">█</tspan></text>
    </g>
    <rect width="720" height="300" fill="url(#scan)"/>
    <rect class="sweep" width="720" height="60" fill="url(#band)"/>
  </g>
</svg>